name: repo-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo_gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate showcase-only surface contract
        shell: pwsh
        run: |
          $allowedDirectories = @(
            '.github',
            'docs',
            'media',
            'deck',
            'runtime-review-slice',
            'generated-artifact-validation-slice',
            'helper-generation-contracts'
          )
          $allowedFiles = @(
            '.gitignore',
            '.gitattributes',
            'README.md',
            'LICENSE',
            'SECURITY.md',
            'CONTACT.md',
            'FAQ.md',
            'CONTRIBUTING.md'
          )
          $requiredPaths = @(
            'README.md',
            'docs/one-pager.md',
            'docs/architecture-overview.md',
            'docs/product-overview.md',
            'docs/public-release-checklist.md',
            'docs/repository-scope.md',
            '.github/ISSUE_TEMPLATE/config.yml',
            '.github/workflows/repo-gate.yml'
          )

          $entries = Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' }
          $unexpected = New-Object System.Collections.Generic.List[string]
          foreach ($entry in $entries) {
            if ($entry.PSIsContainer) {
              if ($allowedDirectories -notcontains $entry.Name) {
                $unexpected.Add($entry.Name)
              }
            }
            elseif ($allowedFiles -notcontains $entry.Name) {
              $unexpected.Add($entry.Name)
            }
          }

          if ($unexpected.Count -gt 0) {
            throw "Unexpected top-level entries in public showcase root: $($unexpected -join ', ')"
          }

          $missing = $requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "Missing required public showcase paths: $($missing -join ', ')"
          }

      - name: Check for source-code files anywhere in the tree
        shell: pwsh
        run: |
          # The top-level contract above only constrains ROOT entries, so a code file nested under an allowed
          # directory (docs/, media/, ...) would pass unnoticed. This step closes that hole: the showcase ships
          # structure and documents, never source code, at ANY depth. Extend the list, not the exceptions, if a
          # new code-shaped format appears.
          $bannedExtensions = @('.cs', '.csproj', '.sln', '.ps1', '.psm1', '.psd1', '.ts', '.tsx', '.js', '.mjs', '.cjs', '.jsx', '.py', '.sh', '.bat', '.cmd')
          $violations = git ls-files | Where-Object {
            $bannedExtensions -contains [System.IO.Path]::GetExtension($_).ToLowerInvariant()
          }
          if ($violations) {
            throw "Source-code files are out of scope for the public showcase at any depth: $($violations -join ', ')"
          }

      - name: Check for absolute local path leaks
        shell: pwsh
        run: |
          $trackedFiles = git ls-files
          $textExtensions = @('.md', '.txt', '.json', '.yml', '.yaml', '.svg', '.html', '.css')
          $violations = New-Object System.Collections.Generic.List[string]

          foreach ($file in $trackedFiles) {
            $extension = [System.IO.Path]::GetExtension($file)
            $isTextLike = $textExtensions -contains $extension -or [string]::IsNullOrWhiteSpace($extension)
            if (-not $isTextLike) {
              continue
            }

            $content = Get-Content -LiteralPath $file -Raw -Encoding UTF8
            if ($content -match '(?i)\b[A-Z]:\\') {
              $violations.Add($file)
            }
          }

          if ($violations.Count -gt 0) {
            throw "Absolute local path leak detected in: $($violations -join ', ')"
          }
